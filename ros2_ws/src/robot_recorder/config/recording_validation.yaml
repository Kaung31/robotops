# Opt-in validation profile (mission recording_profile:=validation): the standard
# topics plus AMCL's pose and Gazebo ground truth, so localization can later be
# compared with simulator truth at aligned timestamps. recording.yaml is unchanged.
topics:
  - odom
  - tf
  - tf_static
  - joint_states
  - scan
  - imu/data
  - map
  - cmd_vel/autonomy
  - drive_controller/cmd_vel
  - /clock
  - validation/contacts
  - diagnostics
  - amcl_pose
  - simulation/ground_truth
required_topics: [odom, tf, tf_static, amcl_pose, simulation/ground_truth]
qos:
  diagnostics: {reliability: reliable, durability: volatile, depth: 10}
  validation/contacts: {reliability: reliable, durability: volatile, depth: 100}
  tf: {reliability: reliable, durability: volatile, depth: 100}
  tf_static: {reliability: reliable, durability: transient_local, depth: 1}
  map: {reliability: reliable, durability: transient_local, depth: 1}
  scan: {reliability: best_effort, durability: volatile, depth: 10}
  imu/data: {reliability: best_effort, durability: volatile, depth: 10}
  amcl_pose: {reliability: reliable, durability: transient_local, depth: 1}
  simulation/ground_truth: {reliability: reliable, durability: volatile, depth: 100}
