name: mapping_lab_round_trip
repetitions: 2
expected:
  runtime_mode: sim
  robot_model: robotops_base
  environment: mapping_lab
  navigation_profile: navfn_rpp
mission:
  waypoints:
    - {x: 1.0, y: 0.3, yaw: 0.0}
    - {x: 0.0, y: 0.0, yaw: 0.0}
start:
  x: 0.0
  y: 0.0
  yaw: 0.0
  position_tolerance: 0.35
  yaw_tolerance: 0.4
timeouts:
  response: 15.0
  trial: 180.0
  cancel: 30.0
# Independent RobotOps acceptance policy; does not change Nav2 parameters.
validation:
  xy_tolerance_m: 0.20
  yaw_tolerance_rad: 0.25
  tf_max_age_s: 1.0
  localization_max_age_s: 5.0
  max_xy_variance_m2: 0.25
  max_yaw_variance_rad2: 0.25
