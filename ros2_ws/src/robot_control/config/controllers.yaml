controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    joints: [left_wheel_joint, right_wheel_joint]
    interfaces: [position, velocity]
    use_local_topics: false

drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # wheel_radius and wheel_separation are injected from geometry.yaml at launch.
    position_feedback: true
    open_loop: false
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 5
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    linear.x.max_velocity: 0.4
    linear.x.min_velocity: -0.4
    linear.x.max_acceleration: 0.5
    linear.x.max_deceleration: -0.5
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.5
    angular.z.max_deceleration: -1.5
