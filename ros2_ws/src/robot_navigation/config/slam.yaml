# RobotOps interface-based reconstruction, 2026-10-13.
# No SLAM Toolbox example prose or implementation is included.
# Interface references and licence scope: docs/CONFIGURATION_PROVENANCE.md.

slam_toolbox:
  ros__parameters:
    # RobotOps manages lifecycle through its existing shutdown wrapper.
    use_lifecycle_manager: false
    enable_interactive_mode: false
    use_map_saver: true
    mode: mapping
    solver_plugin: solver_plugins::CeresSolver
    # Input and frame names agree with the shared robot description/TF contract.
    scan_topic: scan
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    min_laser_range: 0.12
    max_laser_range: 12.0
    # Retain scan acceptance thresholds and the single pending-scan queue.
    scan_queue_size: 1
    throttle_scans: 1
    minimum_travel_heading: 0.1
    minimum_travel_distance: 0.1
    minimum_time_interval: 0.1
    # Mapping and matching controls; no new defaults are made explicit here.
    do_loop_closing: true
    use_scan_barycenter: true
    use_scan_matching: true
    resolution: 0.05
    map_update_interval: 1.0
    # Keep original transform timestamps and the existing timing budget.
    restamp_tf: false
    tf_buffer_duration: 30.0
    transform_timeout: 0.3
    transform_publish_period: 0.02
