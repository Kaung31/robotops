# SPDX-License-Identifier: Apache-2.0
# RobotOps interface-based reconstruction, 2026-10-13.
# Sources and unchanged tuning contract: docs/CONFIGURATION_PROVENANCE.md.

amcl:
  ros__parameters:
    # The launch supplies clock selection and requested initial x/y/yaw.
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: {yaw: 0.0, z: 0.0, y: 0.0, x: 0.0}
    save_pose_rate: -1.0
    # AMCL owns map -> odom; odometry owns the base transform.
    tf_broadcast: true
    transform_tolerance: 0.5
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    map_topic: map
    scan_topic: scan
    # Differential-motion noise coefficients retain the accepted tuning.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha5: 0.1
    alpha4: 0.1
    alpha3: 0.1
    alpha2: 0.1
    alpha1: 0.1
    # Motion thresholds, particle population and adaptive sampling.
    update_min_a: 0.05
    update_min_d: 0.05
    resample_interval: 1
    min_particles: 500
    max_particles: 2000
    pf_z: 0.99
    pf_err: 0.05
    # Likelihood-field observation settings for the simulated planar LiDAR.
    laser_model_type: likelihood_field
    max_beams: 90
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    sigma_hit: 0.2
    z_rand: 0.05
    z_hit: 0.95

map_server:
  ros__parameters:
    # The saved-map filename is validated and injected by navigation.launch.py.
    frame_id: map
    topic_name: map
