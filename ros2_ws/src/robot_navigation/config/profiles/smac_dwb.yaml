# RobotOps interface-based reconstruction, 2026-10-13.
# Interface references and preserved tuning contract: docs/CONFIGURATION_PROVENANCE.md.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      # Critic order is observable with short-circuit evaluation; retain it exactly.
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      short_circuit_trajectory_evaluation: true
      stateful: true
      # Score tuning is listed by purpose, independently of example block layout.
      # Heading completion slows down within the goal region.
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      # Endpoint and path attraction retain distinct weights.
      GoalDist.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      PathAlign.scale: 32.0
      # Retain the obstacle score weight alongside path and goal attraction.
      BaseObstacle.scale: 0.02
      # Keep the differential-drive velocity/acceleration bounds, including signs.
      max_vel_theta: 0.8
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      min_vel_x: 0.0
      max_speed_xy: 0.25
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      decel_lim_theta: -1.2
      acc_lim_theta: 1.2
      decel_lim_y: 0.0
      acc_lim_y: 0.0
      decel_lim_x: -0.5
      acc_lim_x: 0.5
      # Sampling density and rollout resolution preserve the existing search.
      vtheta_samples: 24
      vy_samples: 1
      vx_samples: 12
      angular_granularity: 0.025
      linear_granularity: 0.05
      sim_time: 1.7
      # Controller-local stopping and transform limits.
      trans_stopped_velocity: 0.03
      xy_goal_tolerance: 0.15
      transform_tolerance: 0.3

planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      # Preserve full-resolution planning, cost weighting and bounded search.
      downsample_costmap: false
      allow_unknown: false
      cost_travel_multiplier: 2.0
      max_planning_time: 2.0
      max_on_approach_iterations: 1000
      max_iterations: 1000000
      tolerance: 0.2
      smoother:
        # Smoother convergence and data/smoothness weights are unchanged.
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
        max_iterations: 1000
