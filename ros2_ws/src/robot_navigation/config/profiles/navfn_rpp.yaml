# RobotOps interface-based reconstruction, 2026-10-13.
# Accepted tuning values and parameter references: docs/CONFIGURATION_PROVENANCE.md.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Preserve forward-only operation and the approach speed envelope.
      allow_reversing: false
      desired_linear_vel: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Curvature and obstacle-cost regulation retain separate lower bounds.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_gain: 1.0
      cost_scaling_dist: 0.6
      inflation_cost_scaling_factor: 3.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.08
      regulated_linear_scaling_min_radius: 0.9
      # Velocity-scaled lookahead stays bounded by these distances.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      max_lookahead_dist: 0.7
      min_lookahead_dist: 0.3
      lookahead_dist: 0.5
      # Collision projection and heading alignment retain the accepted limits.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      transform_tolerance: 0.3

planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      # Keep Dijkstra selection, known-space planning and endpoint tolerance.
      use_astar: false
      allow_unknown: false
      tolerance: 0.2
