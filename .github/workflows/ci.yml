name: RobotOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-dev.txt
            backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Install locked Python dependencies and backend
        id: python_dependencies
        run: |
          python -m pip install -r requirements-ci.lock -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e backend
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck
      - name: GitHub Actions workflow validation
        run: bash scripts/ci/check_workflows.sh
      - name: Python, C++, YAML, CMake and XML checks
        run: bash scripts/ci/check_static.sh
      - name: Scoped Python type checking
        if: ${{ !cancelled() && steps.python_dependencies.outcome == 'success' }}
        run: pyright --pythonpath "$(command -v python)"
      - name: Backend, model and CI utility tests
        if: ${{ !cancelled() && steps.python_dependencies.outcome == 'success' }}
        run: bash scripts/ci/test_python.sh
      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-test-results
          path: .ci-results/*.xml
          retention-days: 14

  web:
    name: Web tests, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact frontend lock
        run: npm ci --no-audit --no-fund
      - name: Frontend tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Read-only replay code build (no private dataset)
        run: npm run build:replay

  jazzy:
    name: Jazzy build and passive package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: >-
      ros:jazzy-ros-base-noble@sha256:a5426de405f6f0a82b0f3def3bbd3bce2a71a91421fe980c17613b4e51ef38d9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install declared ROS and test dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-venv
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src --rosdistro jazzy -y
          rosdep check --from-paths ros2_ws/src --ignore-src --rosdistro jazzy
      - name: Build all packages without running robotics
        run: bash scripts/ci/build_ros.sh
      - name: Verify installed manifests, resources and Python imports
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          repository="$PWD"
          cd /tmp
          python3 "$repository/scripts/ci/verify_ros_install.py" "$repository"
      - name: Run explicit passive package test suite
        run: bash scripts/ci/test_ros.sh
      - name: Offline ROS-dependent utility fixtures
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          python3 -m venv --system-site-packages .ci-results/ros-venv
          .ci-results/ros-venv/bin/pip install -c requirements-ci.lock pytest pydantic lark PyYAML
          .ci-results/ros-venv/bin/python scripts/ci/prepare_ros_fixtures.py
          .ci-results/ros-venv/bin/python -m pytest -q \
            scripts/test/test_warehouse*.py --junitxml=.ci-results/ros-utilities.xml
      - name: Report test results and resolved package versions
        if: always()
        run: |
          mkdir -p .ci-results
          dpkg-query -W > .ci-results/ros-system-packages.tsv
          source /opt/ros/jazzy/setup.bash
          colcon test-result --test-result-base ros2_ws/build --verbose
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: jazzy-passive-test-results
          path: |
            ros2_ws/log/
            ros2_ws/build/*/test_results/
            .ci-results/ros-utilities.xml
            .ci-results/ros-system-packages.tsv
          retention-days: 14
