[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "ros2_ws/log"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["ros2_ws/src/robot_description/test", "ros2_ws/src/robot_control/test",
             "ros2_ws/src/robot_bringup/test", "ros2_ws/src/robot_navigation/test", "ros2_ws/src/robot_recorder/test",
             "ros2_ws/src/mission_manager/test", "ros2_ws/src/experiment_runner/test",
             "ros2_ws/src/robot_diagnostics/test", "backend/tests"]
# ROS launch tests are registered separately with ament, not silently skipped.
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = "-ra --import-mode=importlib"
