[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robotops-backend"
version = "0.1.0"
description = "RobotOps application API and ROS gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  # Not imported directly: ROS-generated message classes (e.g. covariance arrays)
  # need numpy, and this venv does not see system site-packages.
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robotops_backend*"]
